<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>RoPE placement in decoder attention and the KV cache</title>
  <desc>Hidden states project to queries, keys, and values. Queries and keys pass through RoPE. Rotated keys and unrotated values enter the cache and attention.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f7d"/>
    </marker>
    <style>
      .bg { fill: #fffdf8; }
      .box { fill: #ffffff; stroke: #7c7469; stroke-width: 2; }
      .project { fill: #e6edf1; stroke: #315f7d; }
      .rope { fill: #f7dfd8; stroke: #b6432f; }
      .cache { fill: #eee6f2; stroke: #6e4f7d; }
      .attention { fill: #18334b; stroke: #18334b; }
      .arrow { fill: none; stroke: #315f7d; stroke-width: 4; marker-end: url(#arrow); }
      .title { font: 700 24px Inter, Arial, sans-serif; fill: #20211f; }
      .label { font: 700 17px Inter, Arial, sans-serif; fill: #20211f; }
      .small { font: 14px Inter, Arial, sans-serif; fill: #68665f; }
      .white { fill: #fffdf8; }
      .red { fill: #b6432f; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="55" y="48">RoPE transforms Q and K before attention and cache use</text>

  <rect class="box" x="55" y="285" width="170" height="100" rx="15"/>
  <text class="label" x="140" y="325" text-anchor="middle">Hidden states</text>
  <text class="small" x="140" y="353" text-anchor="middle">token content</text>

  <rect class="box project" x="300" y="105" width="170" height="90" rx="15"/>
  <text class="label" x="385" y="142" text-anchor="middle">Q projection</text>
  <text class="small" x="385" y="168" text-anchor="middle">query heads</text>

  <rect class="box project" x="300" y="285" width="170" height="90" rx="15"/>
  <text class="label" x="385" y="322" text-anchor="middle">K projection</text>
  <text class="small" x="385" y="348" text-anchor="middle">key heads</text>

  <rect class="box project" x="300" y="465" width="170" height="90" rx="15"/>
  <text class="label" x="385" y="502" text-anchor="middle">V projection</text>
  <text class="small" x="385" y="528" text-anchor="middle">value heads</text>

  <path class="arrow" d="M225 320 C265 250 270 150 300 150"/>
  <path class="arrow" d="M225 335 L300 330"/>
  <path class="arrow" d="M225 350 C265 420 270 510 300 510"/>

  <rect class="box rope" x="550" y="105" width="185" height="90" rx="15"/>
  <text class="label red" x="642" y="142" text-anchor="middle">RoPE at position p</text>
  <text class="small" x="642" y="168" text-anchor="middle">rotate Q</text>

  <rect class="box rope" x="550" y="285" width="185" height="90" rx="15"/>
  <text class="label red" x="642" y="322" text-anchor="middle">RoPE at position p</text>
  <text class="small" x="642" y="348" text-anchor="middle">rotate K</text>

  <path class="arrow" d="M470 150 L550 150"/>
  <path class="arrow" d="M470 330 L550 330"/>

  <rect class="box cache" x="815" y="275" width="185" height="110" rx="15"/>
  <text class="label" x="907" y="312" text-anchor="middle">KV cache</text>
  <text class="small" x="907" y="340" text-anchor="middle">rotated K</text>
  <text class="small" x="907" y="363" text-anchor="middle">ordinary V</text>

  <path class="arrow" d="M735 330 L815 330"/>
  <path class="arrow" d="M470 510 C680 510 710 380 815 355"/>

  <rect class="box attention" x="1040" y="225" width="130" height="210" rx="15"/>
  <text class="label white" x="1105" y="295" text-anchor="middle">Attention</text>
  <text class="small white" x="1105" y="325" text-anchor="middle">Qᵣ Kᵣᵀ</text>
  <text class="small white" x="1105" y="350" text-anchor="middle">softmax</text>
  <text class="small white" x="1105" y="375" text-anchor="middle">× V</text>

  <path class="arrow" d="M735 150 C900 150 965 235 1040 280"/>
  <path class="arrow" d="M1000 330 L1040 330"/>

  <text class="small" x="642" y="235" text-anchor="middle">Q is used now; it is not stored as a KV-cache entry</text>
  <text class="small" x="600" y="625" text-anchor="middle">At decode step t, p must continue from the absolute cache position. Cached keys are not rotated again.</text>
</svg>
